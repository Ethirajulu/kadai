# SonarQube Configuration for Kadai Project
sonar.projectKey=kadai-ai-sales-assistant
sonar.projectName=Kadai - AI Sales Assistant Platform
sonar.projectVersion=1.0.0

# Source code directories
sonar.sources=apps,libs,scripts
sonar.sourceEncoding=UTF-8

# Test directories and coverage
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts,**/*.spec.js,**/*.test.ts,**/*.test.js,**/*.spec.tsx,**/*.test.tsx,**/test_*.py,**/*_test.py
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Language-specific settings
sonar.typescript.node.maxspace=8192
sonar.javascript.node.maxspace=8192

# Exclusions for generated code and dependencies
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/tmp/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/*.bundle.js,\
  **/generated/**,\
  **/*.d.ts,\
  **/venv/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/migrations/**,\
  **/prisma/generated/**,\
  apps/*/webpack.config.js,\
  apps/*/jest.config.ts,\
  libs/*/jest.config.ts

# Test exclusions (files that should not be considered as main code)
sonar.test.exclusions=\
  apps/**/src/assets/**,\
  **/*.spec.ts,\
  **/*.spec.js,\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.spec.tsx,\
  **/*.test.tsx,\
  **/test_*.py,\
  **/*_test.py,\
  **/jest.setup.ts,\
  **/test-setup.ts,\
  **/global-setup.ts,\
  **/global-teardown.ts

# Security hotspot rules
sonar.security.hotspots.disable=false

# Quality gate conditions
sonar.qualitygate.wait=true

# Scanner analysis parameters
sonar.analysis.mode=publish
sonar.buildString=$BUILD_NUMBER

# Language detection
sonar.lang.patterns.ts=**/*.ts
sonar.lang.patterns.tsx=**/*.tsx
sonar.lang.patterns.js=**/*.js,**/*.jsx
sonar.lang.patterns.py=**/*.py

# Security rules configuration
sonar.security.review.enable=true

# Issue severity mapping
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.d.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S*  
sonar.issue.ignore.multicriteria.e2.resourceKey=**/webpack.config.js
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/migrations/**

# Custom rules for Node.js/NestJS applications
sonar.typescript.node.maxspace=8192
sonar.nodejs.maxspace=8192

# Python specific settings
sonar.python.version=3.11